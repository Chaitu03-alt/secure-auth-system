<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set New Password — Secure Auth System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Geist', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col justify-between font-sans antialiased">
    <header class="floating-navbar glass-nav sticky top-3 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5 text-zinc-100 hover:text-white transition group">
                <span class="w-8 h-8 rounded-lg bg-zinc-900/80 border border-white/10 flex items-center justify-center text-rose-400">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </span>
                <span class="font-semibold tracking-tight text-sm">secure<span class="text-zinc-500">.auth</span></span>
            </a>
            <div class="flex items-center gap-4 text-xs font-medium">
                <a href="/login" class="px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/10 text-zinc-200 border border-white/10 transition">Sign in</a>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md rounded-2xl glass-panel auth-card shadow-2xl p-8 sm:p-10">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 mb-5">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                </svg>
            </div>

            <h1 class="text-2xl font-bold tracking-tight text-zinc-100">Set New Password</h1>
            <p class="text-zinc-400 text-xs sm:text-sm mt-1 mb-6">Choose a strong, unique password for your account.</p>

            {% if msg %}
            <div class="mb-5 p-3 rounded-lg border border-rose-800 bg-rose-950/40 text-rose-300 text-xs font-medium">
                {{ msg }}
            </div>
            {% endif %}

            <form method="POST" action="/reset-password" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="token" value="{{ token }}">

                <div>
                    <label for="new_password" class="block text-xs font-medium text-zinc-300 mb-1.5">New Password (Min 8 chars)</label>
                    <input type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password"
                        class="w-full px-3.5 py-2.5 bg-zinc-900/90 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-rose-500">
                </div>

                <div>
                    <label for="confirm_password" class="block text-xs font-medium text-zinc-300 mb-1.5">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password"
                        class="w-full px-3.5 py-2.5 bg-zinc-900/90 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none focus:ring-1 focus:ring-rose-500">
                </div>

                <button type="submit"
                    class="w-full py-2.5 px-4 bg-zinc-100 hover:bg-white text-zinc-950 font-semibold text-sm rounded-lg shadow-sm transition flex items-center justify-center gap-2">
                    Update Password & Revoke Active Sessions
                </button>
            </form>
        </div>
    </main>
</body>
</html>
