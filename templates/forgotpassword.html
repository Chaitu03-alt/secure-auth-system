<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password — secure-auth-system</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</head>
<body class="auth-page">
    <nav class="navbar" aria-label="Main">
        <div class="container nav-inner">
            <a class="brand-link" href="/">secure-auth-system</a>
            <div class="nav-actions">
                <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode" aria-pressed="false">Dark</button>
                <a href="/login" class="btn btn-ghost">Sign In</a>
            </div>
        </div>
    </nav>

    <main class="container auth-container">
        <div class="auth-card" style="max-width: 560px; margin: 30px auto; padding: 2.5rem 2rem;">
            <div class="auth-left" style="max-width: 100%; width: 100%;">
                <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Reset your password</h1>
                <p class="lead" style="color: var(--muted); margin-bottom: 1.5rem;">
                    Enter your account username and your new password below.
                </p>

                {% if msg %}
                    <div class="alert {% if success %}alert-success{% else %}alert-danger{% endif %}">
                        {{ msg }}
                    </div>
                {% endif %}

                <form class="auth-form" method="POST" action="/forgot-password" aria-label="Reset password form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <label for="username" style="font-weight: 500;">Account Username</label>
                    <input type="text" id="username" name="username" placeholder="e.g. john_doe" required autocomplete="username" autofocus>

                    <label for="new_password" style="font-weight: 500;">New Secure Password</label>
                    <input type="password" id="new_password" name="new_password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8">
                    <span style="font-size: 0.8rem; color: var(--subtle); margin-top: -0.35rem; margin-bottom: 0.25rem;">
                        Must be at least 8 characters long.
                    </span>

                    <button type="submit" class="btn btn-primary btn-xl" style="margin-top: 0.75rem;">
                        Update Password & Protect Account
                    </button>
                </form>

                <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--outline); padding-top: 1rem;">
                    <a href="/login" class="link-muted" style="font-size: 0.9rem; text-decoration: underline;">
                        ← Return to Sign In
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
