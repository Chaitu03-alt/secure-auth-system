<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password — Secure Auth System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Geist', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #09090b;
            color: #fafafa;
        }

        .mesh-gradient {
            background-image: radial-gradient(at 50% 0%, rgba(244, 63, 94, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
</head>

<body
    class="min-h-screen mesh-gradient flex flex-col justify-between selection:bg-rose-500/20 selection:text-rose-400 font-sans antialiased">

    <!-- Floating Pill Navbar -->
    <header class="floating-navbar glass-nav sticky top-3 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5 text-zinc-100 hover:text-white transition group">
                <span
                    class="w-8 h-8 rounded-lg bg-zinc-900/80 border border-white/10 flex items-center justify-center text-rose-400 group-hover:border-rose-500/40 transition">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </span>
                <span class="font-semibold tracking-tight text-sm">secure<span class="text-zinc-500">.auth</span></span>
            </a>
            <div class="flex items-center gap-4 text-xs font-medium">
                <a href="/login"
                    class="px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/10 text-zinc-200 border border-white/10 hover:border-white/20 transition">
                    Sign in
                </a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div
            class="w-full max-w-md rounded-2xl glass-panel auth-card shadow-2xl p-8 sm:p-10">

            <div
                class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 mb-5">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                </svg>
            </div>

            <div
                class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-medium mb-3">
                <span class="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse"></span>
                Key Rotation Procedure
            </div>

            <h1 class="text-2xl font-bold tracking-tight text-zinc-100">Reset Password</h1>
            <p class="text-zinc-400 text-xs sm:text-sm mt-1 mb-6">Specify your username and derive a new salted key.</p>

            {% if msg %}
            <div
                class="mb-5 p-3 rounded-lg border {% if success %}bg-emerald-950/40 border-emerald-800 text-emerald-300{% else %}border-rose-800 bg-rose-950/40 text-rose-300{% endif %} text-xs font-medium flex items-center gap-2.5">
                <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>{{ msg }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/forgot-password" class="space-y-4" aria-label="Reset password form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div>
                    <label for="username" class="block text-xs font-medium text-zinc-300 mb-1.5">Account
                        Username</label>
                    <div class="relative">
                        <span
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </span>
                        <input type="text" id="username" name="username" placeholder="Enter username" required
                            autocomplete="username" autofocus
                            class="w-full pl-10 pr-3.5 py-2.5 bg-zinc-900/90 border border-zinc-800 rounded-lg text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-1 focus:ring-rose-500 focus:border-rose-500 transition">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="new_password" class="block text-xs font-medium text-zinc-300">New Password</label>
                        <span class="text-[11px] text-zinc-500">Min 8 characters</span>
                    </div>
                    <div class="relative">
                        <span
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                        <input type="password" id="new_password" name="new_password" placeholder="••••••••••••" required
                            autocomplete="new-password" minlength="8"
                            class="w-full pl-10 pr-3.5 py-2.5 bg-zinc-900/90 border border-zinc-800 rounded-lg text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-1 focus:ring-rose-500 focus:border-rose-500 transition">
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-2.5 px-4 bg-zinc-100 hover:bg-white text-zinc-950 font-semibold text-sm rounded-lg shadow-sm transition hover:shadow-rose-500/10 hover:shadow-lg active:scale-[0.99] flex items-center justify-center gap-2">
                    <span>Rotate Key & Protect Account</span>
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-zinc-900 text-center">
                <a href="/login"
                    class="text-xs text-zinc-400 hover:text-zinc-200 transition inline-flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    <span>Return to Sign In</span>
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-zinc-900 py-6 text-center text-xs text-zinc-600">
        <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
            <p>© <span id="year"></span> secure-auth-system. Enterprise Grade Infrastructure.</p>
            <div class="flex gap-4">
                <a href="#" class="hover:text-zinc-400 transition">Security Policy</a>
                <a href="#" class="hover:text-zinc-400 transition">Telemetry</a>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
